name: commit-lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pushed range (and the pull request range) has to be resolvable.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # semantic-release only derives a version from Conventional Commits; a
      # malformed subject means "merged but nothing released".
      - name: Check commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commits.mjs
