name: pipeline

# Single gate for main and release tags: the suite runs once, then the release
# derives a version and the image workflow is called with that exact ref. There
# is no second checks invocation on the tag or on the rolling main image.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Serialize main pushes so two releases cannot race on the same history;
  # never cancel an in-flight release.
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Derives the next version from the Conventional Commits on main, then tags
  # and releases it. The tag is created with GITHUB_TOKEN and does not trigger
  # this workflow again; publish-tag below builds the image from that tag.
  release:
    needs:
      - checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-release reads every commit since the last release tag.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # semantic-release requires ^22.14.0 || >= 24.10.0.
          node-version: 24
      - name: Previous release tag
        id: before
        run: |
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The plugin list in .releaserc.json is limited to plugins that ship as
        # dependencies of semantic-release, so nothing has to be installed in
        # the repository (and nothing extra lands in the image).
        run: npx --yes semantic-release@25
      - name: New release tag
        id: version
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$tag" ] && [ "$tag" != "${{ steps.before.outputs.tag }}" ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "released $tag"
          else
            echo "no release this run"
          fi

  publish-tag:
    needs:
      - checks
      - release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      checkout_ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.tag }}
      latest: false

  # main pushes still refresh `latest`, but from the exact commit that just
  # passed checks instead of whatever main points at when the build starts.
  publish-latest:
    needs:
      - checks
      - release
    if: github.ref == 'refs/heads/main' && needs.checks.result == 'success' && needs.release.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      checkout_ref: ${{ github.sha }}
      version: ""
      latest: true

  # A tag pushed by a human is not covered by a release run, so pipeline runs
  # checks first and builds it directly.
  publish-tag-push:
    needs:
      - checks
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      checkout_ref: ${{ github.ref_name }}
      version: ${{ github.ref_name }}
      latest: false
